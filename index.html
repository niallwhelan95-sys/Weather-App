<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Blend">
<meta name="theme-color" content="#0f1a2e">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<title>Weather Blend</title>
<style>
  :root {
    --text: #fff; --muted: rgba(255,255,255,.68); --faint: rgba(255,255,255,.4);
    --card: rgba(255,255,255,.12); --card-b: rgba(255,255,255,.16);
    --good: #7ee0a1; --mid: #ffd166; --bad: #ff8a80; --rain: #7cc4ff;
    --sky1: #2a5298; --sky2: #1e3c72;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    color: var(--text);
    background: var(--sky2);
    padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px);
  }
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; background: linear-gradient(170deg, var(--sky1), var(--sky2)); }
  body.clear-day { --sky1:#3e8ede; --sky2:#1b5fae; }
  body.cloud-day { --sky1:#6b7f99; --sky2:#3e4f66; }
  body.rain     { --sky1:#3f5168; --sky2:#1f2b3a; }
  body.storm    { --sky1:#2c2f45; --sky2:#121420; }
  body.snow     { --sky1:#9fb3c8; --sky2:#5f7389; }
  body.fog      { --sky1:#8a94a0; --sky2:#56606b; }
  body.night    { --sky1:#1b2440; --sky2:#070b18; }
  main { max-width: 560px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 8px; padding: 14px 0 4px; }
  .place { flex: 1; font-weight: 600; font-size: 17px; background: none; border: 0; color: inherit; text-align: left; padding: 0; font-family: inherit; }
  .place small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
  .icon-btn { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--card); color: #fff; font-size: 17px; }
  .hero { text-align: center; padding: 18px 0 8px; }
  .hero .emoji { font-size: 56px; line-height: 1; }
  .hero .temp { font-size: 88px; font-weight: 200; line-height: 1; letter-spacing: -3px; margin: 6px 0 2px; }
  .hero .cond { font-size: 19px; }
  .hero .sub { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .badge { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; padding: 6px 12px; border-radius: 99px; background: var(--card); font-size: 13px; border: 0; color: inherit; font-family: inherit; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .card { background: var(--card); border: 1px solid var(--card-b); border-radius: 20px; padding: 14px 16px; margin-top: 12px; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
  .card h2 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
  .headline { font-size: 19px; font-weight: 600; margin-bottom: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: rgba(255,255,255,.14); border-radius: 12px; padding: 8px 11px; font-size: 14px; }
  .tips { margin: 12px 0 0; padding: 0; list-style: none; font-size: 14px; color: var(--muted); }
  .tips li { padding: 4px 0 4px 18px; position: relative; }
  .tips li::before { content: "→"; position: absolute; left: 0; color: var(--faint); }
  .legs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .leg { background: rgba(0,0,0,.14); border-radius: 14px; padding: 10px 12px; font-size: 13px; color: var(--muted); }
  .leg b { display: block; color: #fff; font-size: 17px; font-weight: 600; margin-top: 2px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid2 .card { margin-top: 12px; }
  .stat { font-size: 20px; font-weight: 600; }
  .stat-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .nowcast { display: flex; align-items: flex-end; gap: 3px; height: 40px; margin-top: 10px; }
  .nowcast span { flex: 1; background: var(--rain); border-radius: 3px 3px 0 0; min-height: 2px; opacity: .9; }
  .nc-axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--faint); margin-top: 4px; }
  .scroll { overflow-x: auto; margin: 0 -16px; padding: 0 16px; scrollbar-width: none; }
  .scroll::-webkit-scrollbar { display: none; }
  .hours { position: relative; }
  .hrow { display: flex; }
  .hcol { width: 52px; flex: none; text-align: center; font-size: 13px; }
  .hcol .t { color: var(--muted); }
  .hcol .i { font-size: 20px; margin: 4px 0; }
  .hcol .p { color: var(--rain); font-size: 11px; height: 14px; }
  .hcol .v { font-weight: 600; }
  .day { display: grid; grid-template-columns: 52px 30px 40px 36px 1fr 36px; align-items: center; gap: 6px; padding: 9px 0; border-top: 1px solid rgba(255,255,255,.08); font-size: 15px; }
  .day:first-of-type { border-top: 0; }
  .day .pp { color: var(--rain); font-size: 12px; }
  .day .lo { color: var(--muted); text-align: right; }
  .bar { height: 5px; border-radius: 3px; background: rgba(0,0,0,.2); position: relative; }
  .bar i { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: linear-gradient(90deg, #7cc4ff, #ffd166, #ff8a65); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: right; color: var(--faint); font-weight: 500; padding: 4px 2px; }
  th:first-child, td:first-child { text-align: left; }
  td { text-align: right; padding: 7px 2px; border-top: 1px solid rgba(255,255,255,.08); }
  td.off { color: var(--faint); }
  .alert { background: rgba(255,138,128,.22); border-color: rgba(255,138,128,.45); }
  .foot { text-align: center; color: var(--faint); font-size: 12px; margin-top: 18px; }
  .loading { text-align: center; padding: 120px 0; color: var(--muted); }
  .spinner { width: 34px; height: 34px; border: 3px solid rgba(255,255,255,.2); border-top-color: #fff; border-radius: 50%; margin: 0 auto 14px; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* settings sheet */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; z-index: 10; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; background: #1a2333; border-radius: 22px 22px 0 0; padding: 18px 18px calc(env(safe-area-inset-bottom) + 18px); max-height: 88vh; overflow: auto; z-index: 11; transform: translateY(105%); transition: transform .3s, visibility .3s; visibility: hidden; max-width: 560px; margin: 0 auto; }
  .open .sheet-bg { display: block; }
  .open .sheet { transform: none; visibility: visible; }
  .sheet h3 { margin: 0 0 14px; }
  .field { margin-bottom: 18px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .seg { display: flex; background: rgba(255,255,255,.08); border-radius: 10px; padding: 3px; }
  .seg button { flex: 1; border: 0; background: none; color: #fff; padding: 8px; border-radius: 8px; font: inherit; }
  .seg button.on { background: rgba(255,255,255,.2); }
  input, select { width: 100%; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); color: #fff; border-radius: 10px; padding: 10px; font: inherit; font-size: 16px; }
  input[type=range] { padding: 0; accent-color: #7cc4ff; }
  .row { display: flex; gap: 10px; align-items: center; }
  .btn { width: 100%; border: 0; border-radius: 12px; padding: 12px; font: inherit; font-weight: 600; background: #7cc4ff; color: #0b1a2e; }
  .btn.ghost { background: rgba(255,255,255,.1); color: #fff; }
  .results button { display: block; width: 100%; text-align: left; background: none; border: 0; color: #fff; padding: 10px 2px; border-bottom: 1px solid rgba(255,255,255,.08); font: inherit; }
  .results small { color: var(--muted); }
</style>
</head>
<body>
<main id="app"><div class="loading"><div class="spinner"></div>Finding you…</div></main>

<div id="sheetWrap">
  <div class="sheet-bg" onclick="closeSheet()"></div>
  <div class="sheet">
    <h3>Settings</h3>
    <div class="field">
      <label>Location</label>
      <button class="btn ghost" onclick="useGps()">📍 Use my current location</button>
      <div style="height:8px"></div>
      <input id="search" placeholder="Search a town or city…" autocomplete="off">
      <div class="results" id="results"></div>
    </div>
    <div class="field">
      <label>When are you out? (outfit is planned for this window)</label>
      <div class="row"><select id="from"></select><span>to</span><select id="to"></select></div>
    </div>
    <div class="field">
      <label>I usually run… <span id="biasLbl"></span></label>
      <input type="range" id="bias" min="-3" max="3" step="1">
      <div class="nc-axis"><span>Warm</span><span>Normal</span><span>Cold</span></div>
    </div>
    <div class="field">
      <label>Units</label>
      <div class="seg" id="units"><button data-u="C">°C · km/h</button><button data-u="F">°F · mph</button></div>
    </div>
    <button class="btn" onclick="saveSettings()">Save</button>
  </div>
</div>

<script>
const KEY = 'wb-settings';
const S = Object.assign({ unit: 'C', bias: 0, from: 8, to: 22, place: null, last: null }, safeGet(KEY));
let data = null, loadedAt = 0, placeName = '';

function safeGet(k) { try { return JSON.parse(localStorage.getItem(k)) || {}; } catch { return {}; } }
function persist() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }

const WMO = {
  0:['Clear','☀️','🌙'], 1:['Mostly clear','🌤️','🌙'], 2:['Partly cloudy','⛅','☁️'], 3:['Overcast','☁️','☁️'],
  45:['Fog','🌫️'], 48:['Freezing fog','🌫️'], 51:['Light drizzle','🌦️'], 53:['Drizzle','🌦️'], 55:['Heavy drizzle','🌧️'],
  56:['Freezing drizzle','🌧️'], 57:['Freezing drizzle','🌧️'], 61:['Light rain','🌧️'], 63:['Rain','🌧️'], 65:['Heavy rain','🌧️'],
  66:['Freezing rain','🌧️'], 67:['Freezing rain','🌧️'], 71:['Light snow','🌨️'], 73:['Snow','❄️'], 75:['Heavy snow','❄️'], 77:['Snow grains','🌨️'],
  80:['Showers','🌦️'], 81:['Showers','🌧️'], 82:['Heavy showers','⛈️'], 85:['Snow showers','🌨️'], 86:['Snow showers','🌨️'],
  95:['Thunderstorm','⛈️'], 96:['Thunder & hail','⛈️'], 99:['Thunder & hail','⛈️'],
};
const wmo = (c, day = true) => { const w = WMO[c] || ['—', '🌡️']; return { label: w[0], icon: (!day && w[2]) || w[1] }; };
const skyClass = (c, day) => !day ? 'night' : c >= 95 ? 'storm' : (c >= 71 && c <= 77) || c === 85 || c === 86 ? 'snow' : c >= 51 ? 'rain' : c === 45 || c === 48 ? 'fog' : c >= 2 ? 'cloud-day' : 'clear-day';
const T = (c) => c == null ? '–' : Math.round(S.unit === 'F' ? c * 9 / 5 + 32 : c) + '°';
const W = (k) => k == null ? '–' : S.unit === 'F' ? Math.round(k / 1.609) + ' mph' : Math.round(k) + ' km/h';
const hhmm = (ms) => new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const hh = (ms) => new Date(ms).toLocaleTimeString([], { hour: 'numeric' }).replace(' ', '').toLowerCase();
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));

const geo = (opts) => new Promise((ok, no) => {
  if (!navigator.geolocation) return no({ code: 0 });
  navigator.geolocation.getCurrentPosition(ok, no, opts);
});
let locError = null;
async function getCoords() {
  if (S.place) return S.place;
  locError = null;
  try {
    let p;
    try { p = await geo({ timeout: 15000, maximumAge: 600000 }); }
    catch (e) { if (e.code === 1) throw e; p = await geo({ timeout: 20000, maximumAge: Infinity, enableHighAccuracy: false }); }
    S.last = { lat: +p.coords.latitude.toFixed(3), lon: +p.coords.longitude.toFixed(3) };
    persist();
    return S.last;
  } catch (e) {
    locError = e.code === 1
      ? 'Your phone is blocking location for this browser. iPhone Settings → Privacy & Security → Location Services → turn it on for this browser ("While Using"), then tap below.'
      : !window.isSecureContext ? 'Location needs the https:// link.'
      : 'Couldn\'t get a GPS fix. Check Location Services is on, then tap below.';
    if (S.last) return S.last;
    throw new Error(locError);
  }
}
function retryGps() { S.place = null; persist(); load(); }

async function nameFor(c) {
  if (c.name) return c.name;
  try {
    const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${c.lat}&longitude=${c.lon}&localityLanguage=en`);
    const j = await r.json();
    return j.locality || j.city || j.principalSubdivision || 'Your location';
  } catch { return 'Your location'; }
}

async function load() {
  try {
    const c = await getCoords();
    const q = new URLSearchParams({ lat: c.lat, lon: c.lon, from: S.from, to: S.to, bias: S.bias });
    const [res, name] = await Promise.all([fetch('/api/weather?' + q), nameFor(c)]);
    const j = await res.json();
    if (!res.ok) throw new Error(j.error || 'Forecast unavailable');
    data = j; placeName = name; loadedAt = Date.now();
    render();
  } catch (e) {
    document.getElementById('app').innerHTML = `<header><div class="place">Weather Blend</div><button class="icon-btn" onclick="openSheet()">⚙️</button></header>
      <div class="loading">⚠️<br>${esc(e.message)}<br><br><button class="btn" style="width:auto;padding:10px 18px" onclick="retryGps()">📍 Use my location</button>
      <br><br><button class="btn ghost" style="width:auto;padding:10px 18px" onclick="openSheet()">Search a place instead</button></div>`;
  }
}

function render() {
  const d = data, n = d.now, today = d.daily[0] || {};
  const cond = wmo(n.code, n.isDay);
  document.body.className = skyClass(n.code, n.isDay);
  const ok = d.sources.filter((s) => s.ok);
  const agreeColor = { high: 'var(--good)', medium: 'var(--mid)', low: 'var(--bad)' }[d.agreement.level];
  const o = d.outfit, ins = d.insights;

  // nowcast
  const nc = d.nowcast || [];
  const maxMm = Math.max(0.5, ...nc.map((x) => x.mm));
  const wetNow = nc[0]?.mm >= 0.1;
  const firstWet = nc.find((x) => x.mm >= 0.1);
  const firstDry = nc.find((x) => x.mm < 0.1);
  const ncText = !nc.length ? 'Nowcast unavailable'
    : wetNow ? (firstDry ? `Raining now — easing around ${hhmm(firstDry.t)}` : 'Rain for the next few hours')
    : firstWet ? `Rain likely from ${hhmm(firstWet.t)}` : 'No rain in the next 3 hours';

  // hourly chart
  const hrs = d.hours.slice(0, 24), CW = 52, CH = 70;
  const all = hrs.flatMap((h) => [h.tMin, h.tMax]);
  const lo = Math.min(...all), hi = Math.max(...all), span = Math.max(1, hi - lo);
  const y = (v) => 8 + (1 - (v - lo) / span) * (CH - 16);
  const x = (i) => i * CW + CW / 2;
  const band = hrs.map((h, i) => `${x(i)},${y(h.tMax)}`).join(' ') + ' ' + hrs.map((h, i) => `${x(i)},${y(h.tMin)}`).reverse().join(' ');
  const line = hrs.map((h, i) => `${x(i)},${y(h.temp)}`).join(' ');

  // daily range
  const dLo = Math.min(...d.daily.map((x) => x.min)), dHi = Math.max(...d.daily.map((x) => x.max)), dSpan = Math.max(1, dHi - dLo);

  const alerts = (d.alerts || []).map((a) => `<div class="card alert"><h2>⚠️ ${esc(a.severity || 'Warning')}</h2><b>${esc(a.title)}</b><div class="stat-sub">${esc(a.text)}</div></div>`).join('');

  document.getElementById('app').innerHTML = `
  <header>
    <button class="place" onclick="openSheet()">${esc(placeName)} ▾<small>Updated ${hhmm(d.generated)}${locError && !S.place ? ' · last known location' : ''}</small></button>
    <button class="icon-btn" onclick="load()" aria-label="Refresh">↻</button>
    <button class="icon-btn" onclick="openSheet()" aria-label="Settings">⚙️</button>
  </header>

  <section class="hero">
    <div class="emoji">${cond.icon}</div>
    <div class="temp">${T(n.temp)}</div>
    <div class="cond">${cond.label}</div>
    <div class="sub">Feels like ${T(n.feels)} · H ${T(today.max)} L ${T(today.min)} · Wind ${W(n.wind)}</div>
    <button class="badge" onclick="document.getElementById('src').scrollIntoView({behavior:'smooth'})">
      <span class="dot" style="background:${agreeColor}"></span>${ok.length} sources · ${d.agreement.level} agreement
    </button>
  </section>

  ${alerts}

  <div class="card">
    <h2>👔 What to wear · ${esc(o.window.label)} ${o.window.from}–${o.window.to}</h2>
    <div class="headline">${esc(o.headline)}</div>
    <div class="chips">${o.items.map((i) => `<span class="chip">${i.icon} ${esc(i.label)}</span>`).join('')}</div>
    ${o.tips.length ? `<ul class="tips">${o.tips.map((t) => `<li>${esc(t)}</li>`).join('')}</ul>` : ''}
    <div class="legs">${o.legs.map((l) => `<div class="leg">${esc(l.label)} · ${l.time}<b>${wmo(l.code).icon} ${T(l.temp)}</b>feels ${T(l.feels)}${l.pop != null ? ` · ${l.pop}% rain` : ''}</div>`).join('')}</div>
  </div>

  <div class="card">
    <h2>☔ Next 3 hours</h2>
    <div class="stat" style="font-size:17px">${ncText}</div>
    ${nc.length ? `<div class="nowcast">${nc.map((x) => `<span style="height:${Math.max(2, (x.mm / maxMm) * 40)}px;opacity:${x.mm >= 0.1 ? .95 : .25}"></span>`).join('')}</div>
    <div class="nc-axis"><span>Now</span><span>${hhmm(nc[nc.length - 1].t)}</span></div>` : ''}
  </div>

  <div class="grid2">
    <div class="card"><h2>🌤 Dry spell</h2>
      <div class="stat">${ins.dryWindow ? (ins.dryWindow.allDay ? 'All day' : `${ins.dryWindow.from}–${ins.dryWindow.to}`) : 'None'}</div>
      <div class="stat-sub">${ins.dryWindow ? `Best ${ins.dryWindow.hours}h window for a walk or run` : 'Wet on and off for the next 18h'}</div></div>
    <div class="card"><h2>👕 Washing</h2>
      <div class="stat">${ins.drying ? ins.drying.score + '/10' : '–'}</div>
      <div class="stat-sub">${ins.drying ? esc(ins.drying.label) + ` (${esc(ins.drying.when.toLowerCase())})` : ''}</div></div>
    <div class="card"><h2>🌅 Sun</h2>
      <div class="stat">${today.sunset ? hhmm(today.sunset) : '–'}</div>
      <div class="stat-sub">Sunset${today.sunrise ? ` · rise ${hhmm(today.sunrise)}` : ''}</div></div>
    <div class="card"><h2>🕶 UV · 💨 Gusts</h2>
      <div class="stat">${today.uv != null ? Math.round(today.uv) : '–'} · ${W(o.stats.gustMax)}</div>
      <div class="stat-sub">${today.uv >= 6 ? 'High UV — cover up' : today.uv >= 3 ? 'Moderate UV' : 'Low UV'}</div></div>
  </div>

  <div class="card">
    <h2>⏱ Next 24 hours <span style="text-transform:none;letter-spacing:0">· shaded = range across sources</span></h2>
    <div class="scroll"><div class="hours" style="width:${hrs.length * CW}px">
      <div class="hrow">${hrs.map((h, i) => `<div class="hcol"><div class="t">${i ? hh(h.t) : 'Now'}</div><div class="i">${wmo(h.code, isDayAt(h.t)).icon}</div></div>`).join('')}</div>
      <svg width="${hrs.length * CW}" height="${CH}" style="display:block">
        <polygon points="${band}" fill="rgba(255,255,255,.16)"/>
        <polyline points="${line}" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
        ${hrs.map((h, i) => `<circle cx="${x(i)}" cy="${y(h.temp)}" r="3" fill="#fff"/>`).join('')}
      </svg>
      <div class="hrow">${hrs.map((h) => `<div class="hcol"><div class="v">${T(h.temp)}</div><div class="p">${h.pop >= 15 ? h.pop + '%' : ''}</div></div>`).join('')}</div>
    </div></div>
  </div>

  <div class="card">
    <h2>📅 7 days</h2>
    ${d.daily.map((x, i) => `<div class="day">
      <span>${i ? new Date(x.t).toLocaleDateString([], { weekday: 'short' }) : 'Today'}</span>
      <span>${wmo(x.code).icon}</span>
      <span class="pp">${x.pop >= 20 ? x.pop + '%' : ''}</span>
      <span class="lo">${T(x.min)}</span>
      <div class="bar"><i style="left:${((x.min - dLo) / dSpan) * 100}%;right:${100 - ((x.max - dLo) / dSpan) * 100}%"></i></div>
      <span>${T(x.max)}</span>
    </div>`).join('')}
  </div>

  <div class="card" id="src">
    <h2>📡 Sources · next 24h</h2>
    <div class="stat-sub" style="margin-bottom:8px">${esc(d.agreement.note)}. Typical spread between sources: ±${(d.agreement.avgSpread / 2).toFixed(1)}°.</div>
    <table>
      <tr><th>Source</th><th>Now</th><th>High</th><th>Low</th><th>Rain</th></tr>
      ${d.sources.map((s) => s.ok && s.summary
        ? `<tr><td>${esc(s.name)}</td><td>${T(s.summary.now)}</td><td>${T(s.summary.hi)}</td><td>${T(s.summary.lo)}</td><td>${s.summary.rain != null ? s.summary.rain + 'mm' : s.summary.pop != null ? s.summary.pop + '%' : '–'}</td></tr>`
        : `<tr><td class="off">${esc(s.name)}</td><td class="off" colspan="4">unavailable</td></tr>`).join('')}
      <tr><td><b>Blended</b></td><td><b>${T(d.hours[0].temp)}</b></td><td><b>${T(Math.max(...hrs.map((h) => h.temp)))}</b></td><td><b>${T(Math.min(...hrs.map((h) => h.temp)))}</b></td><td><b>${hrs.reduce((s, h) => s + (h.precip || 0), 0).toFixed(1)}mm</b></td></tr>
    </table>
  </div>

  <div class="foot">Median of ${ok.length} forecasts · Open-Meteo, MET Norway${d.sources.some((s) => s.id === 'meteireann' && s.ok) ? ', Met Éireann' : ''} & more</div>`;
}

function isDayAt(t) {
  const day = data.daily.find((d) => d.sunrise && t >= d.sunrise - 3600000 && t < d.sunrise + 86400000);
  if (!day || !day.sunrise) return true;
  return t >= day.sunrise && t < day.sunset;
}

// ---------- settings
function openSheet() {
  const opts = [...Array(24)].map((_, h) => `<option value="${h}">${String(h).padStart(2, '0')}:00</option>`).join('');
  from.innerHTML = opts; to.innerHTML = opts;
  from.value = S.from; to.value = S.to; bias.value = S.bias; biasLbl.textContent = biasText(S.bias);
  [...units.children].forEach((b) => b.classList.toggle('on', b.dataset.u === S.unit));
  document.getElementById('sheetWrap').classList.add('open');
}
function closeSheet() { document.getElementById('sheetWrap').classList.remove('open'); }
const biasText = (b) => b == 0 ? '(normal)' : b > 0 ? `(cold, +${b})` : `(warm, ${b})`;
bias.oninput = () => (biasLbl.textContent = biasText(+bias.value));
units.onclick = (e) => { const u = e.target.dataset.u; if (!u) return; [...units.children].forEach((b) => b.classList.toggle('on', b.dataset.u === u)); units.dataset.sel = u; };
function saveSettings() {
  S.from = +from.value; S.to = +to.value; S.bias = +bias.value; S.unit = units.dataset.sel || S.unit;
  persist(); closeSheet(); load();
}
function useGps() { S.place = null; persist(); closeSheet(); load(); }
let st;
search.oninput = () => {
  clearTimeout(st);
  const q = search.value.trim();
  if (q.length < 2) { results.innerHTML = ''; return; }
  st = setTimeout(async () => {
    try {
      const j = await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=en`)).json();
      results.innerHTML = (j.results || []).map((r, i) => `<button data-i="${i}">${esc(r.name)} <small>${esc([r.admin1, r.country].filter(Boolean).join(', '))}</small></button>`).join('') || '<div class="stat-sub">No matches</div>';
      results.onclick = (e) => {
        const b = e.target.closest('button'); if (!b) return;
        const r = j.results[b.dataset.i];
        S.place = { lat: +r.latitude.toFixed(3), lon: +r.longitude.toFixed(3), name: r.name };
        persist(); search.value = ''; results.innerHTML = ''; closeSheet(); load();
      };
    } catch {}
  }, 300);
};

document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - loadedAt > 15 * 60000) load(); });
load();
</script>
